-
  name: "Bluetooth UUID names"
  uri: "/phy/bluetooth/uuid_names"
  types: ["anyjson"]
  methods: ["POST"]
  roles: ["readonly"]
  added: "after 2026-10-R1"
  jsonparameters:
    - {name: "uuids", type: "list", description: "Up to 64 service UUIDs"}
  docs: |
    Names Bluetooth service UUIDs from the Bluetooth ID list (`btoidfile`), as the web UI's device details
    show them.  Each UUID is a 16-bit assigned number (`feaf`), the same number in 32 bits (`0000feaf`), or the
    128-bit Bluetooth base form (`0000feaf-0000-1000-8000-00805f9b34fb`); other entries are ignored.

    ```json
    {"uuids": ["feaf", "0000180f-0000-1000-8000-00805f9b34fb"]}
    ```
  return: |
    Dictionary of each known UUID, as it was given in lowercase, to its name; unknown UUIDs are left out.
  responses:
    success:
      - [200, "Success"]
    failure:
      - [400, "Missing `uuids`, not a list, or more than 64 entries"]

-
  name: "BTLE related devices"
  uri: "/phy/btle/related-of/{DEVICEKEY}/devices"
  types: ["anyjson"]
  methods: ["GET", "POST"]
  roles: ["readonly"]
  added: "after 2026-10-R1"
  jsonparameters:
    - {auto: "fields"}
  docs: |
    The devices in the same [related group](/docs/readme/configuring/randomized_macs/#btle-related-devices) as
    the BTLE device `{DEVICEKEY}`, the device itself included: the random addresses advertising the same payload,
    as the web UI's *BTLE Related Devices* timeline shows them.

    The list is empty when related devices are off (`btle_related`), or the device isn't in a group.
  return: |
    Array of devices
  responses:
    success:
      - [200, "Success"]
    failure:
      - [500, "Invalid device key"]
