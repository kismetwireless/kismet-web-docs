- 
  name: "List available log types"
  uri: "/logging/drivers"
  types: ["anyjson"]
  roles: ["readonly"]
  methods: ["GET"]
  docs: |
    Fetch a list of all available log drivers. 

    Each logging driver handles a log output format. 

- 
  name: "List active logs"
  uri: "/logging/active"
  types: ["anyjson"]
  roles: ["readonly"]
  methods: ["GET"]
  docs: | 
    List enabled and active logs 

    After 2026-10-R1, each log has `kismet.logfile.rotate_overdue_since`: the time (unix seconds)
    the kismetdb log's next file was due but hasn't been started yet, or `0` when it isn't late.

- 
  name: "Start a log"
  uri: "/logging/by-class/{LOGCLASS}/start"
  types: ["cmd"]
  methods: ["GET", "POST"]
  uriparameters: 
    - {name: "LOGCLASS", type: "string", description: "Log class / type to start"}
  jsonparameters: 
    - {name: "title", type: "string", required: false, description: "Title for this log's file name, in place of the session title; after 2026-10-R1"}
  docs: | 
    Open a new log; if the same type of log is closed and opened multiple times in one session, it 
    will have multipe log instances (such as `Kismet-foo-2022-10-03-1.pcap`, 
    `kismet-foo-2022-10-03-2.pcap` )

    After 2026-10-R1, an optional `title`, sent as POST JSON, names only the log being opened; the
    session title, and the other logs, are unchanged.  The title is 1 to 64 characters of `A-Z`,
    `a-z`, `0-9`, `.`, `_`, and `-`, not starting with `.`; any other title is refused, and no log
    is opened.
  notes: | 
    Some logs, like kismetdb, are only permitted a single logging instance. 
  return: |
    Success or failure of log opening.
  responses:
    success:
      - [200, "Success"]
    failure:
      - [-1, "Request error, such as malformed log class or permissions error"]

- 
  name: "Stopping a log"
  uri: "/logging/by-uuid/{UUID}/stop"
  types: ["cmd"]
  methods: ["GET"]
  uriparameters: 
    - {name: "UUID", type: "string", description: "Log UUID to stop"}
  docs: | 
    Stop and close a current log.  

- 
  name: "Start a new log file"
  uri: "/logging/by-uuid/{UUID}/rotate"
  types: ["cmd"]
  methods: ["POST"]
  uriparameters: 
    - {name: "UUID", type: "string", description: "Log UUID to start a new file for"}
  docs: | 
    After 2026-10-R1, closes the current file of a kismetdb or pcapng log and continues the log in
    a new file, the same as when the log reaches `kis_log_max_mb` / `kis_log_max_seconds` or
    `pcapng_log_max_mb` / `pcapng_log_max_seconds`.  The new file starts shortly after the
    request returns, and no packets are lost.

    The log template needs `%i`, so the new file gets the next sequence number.

    When the old file is closed and complete, a `LOG_FINISHED` event is published on the
    [eventbus](/docs/api/eventbus/) with the reason `api`.
  notes: | 
    Only kismetdb and pcapng logs can start a new file.
  return: |
    `OK` when the new file has been requested.
  responses:
    success:
      - [200, "Success"]
    failure:
      - [500, "Invalid UUID, no such log, a log type which can't start a new file, a log which isn't open, or a log template without `%i`"]
