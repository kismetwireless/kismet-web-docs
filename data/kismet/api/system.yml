
-
  name: "System status"
  uri: "/system/status"
  methods: ["GET", "POST"]
  types: ["anyjson"]
  roles: ["readonly"]
  docs: |
    The status endpoint returns almost all data around the current system status, 
    load, system health, thermal and fan sensors (if any), memory use, battery state,
    runtime, and more.
  jsonparameters: 
    -
      auto: "fields"
  return: | 
    JSON object of system status snapshot.
  responses:
    success:
      - [200, "Basic success and JSON object"]
    failure:
      - [-1, "On error (typically for malformed simplification)"]

-
  name: "Timestamp"
  uri: "/system/timestamp"
  methods: ["GET"]
  types: ["anyjson"]
  roles: ["readonly"]
  docs: |
    Fetch the system timestamp as a second and microsecond; this can be used 
    to synchronize timestamps with the UI or as a keep-alive check.
  return: |
    JSON object of the timestamp as second and microsecond.
  responses:
    success:
      - [200, "JSON object"]

-
  name: "Tracked fields"
  uri: "/system/tracked_fields"
  methods: ["GET"]
  types: ["html"]
  roles: ["readonly"]
  docs: |
    To aid in development, Kismet maintains a list of all known field names, 
    data types, and descriptions.

    This endpoint returns a human-readable HTML page of all fields.
  return: |
    HTML document
  responses:
    success:
      - [200, "HTML document"]

-
  name: "Packet statistics"
  uri: "/packetchain/packet_stats"
  types: ["anyjson"]
  methods: ["GET", "POST"]
  roles: ["readonly"]
  jsonparameters: 
    -
      auto: "fields"
  docs: |
    Kismet exposes the packet processing statistics as RRD (round robin database) 
    collections for incoming packet rate, packet proessing rates, data size, 
    and more.

    The RRD format encodes long-running data as collections of decreasing accuracy, 
    reporting the past 60 seconds, past hour as 60 second averages, and past 
    day as 1 hour averages. 
  return: |
    JSON object of RRD packet stats.
  responses:
    success:
      - [200, "JSON object"]
    failure:
      - [-1, "On error (typically for malformed simplification)"]

-
  name: "Dynamic Javascript import"
  uri: "/dynamic"
  types: ["js"]
  roles: ["readonly"]
  methods: ["GET"]
  docs: |
    Kismet creates a dynamically generated javascript file for the UI to 
    load the core system and JS plugin modules into the global JS namespace.

    This endpoint is meant to be used by a web-based UI and included as a 
    script import, such as:

    ```html 
    <script src="dynamic.js"></script>
    ```
  result: |
    A Javascript file suitable for import.
  responses:
    success:
      - [200, "Success"]
  

-
  name: "User status"
  uri: "/system/user_status"
  types: ["anyjson"]
  methods: ["GET", "POST"]
  roles: ["none"]
  docs: |
    The user Kismet is running as.  This endpoint does not require a login, so a UI can warn
    about Kismet running as root before the user logs in.
  return: |
    JSON object containing `kismet.system.user`, the system user Kismet is running as.
  responses:
    success:
      - [200, "Success"]

-
  name: "Incoming packet rate"
  uri: "/packetchain/packet_rate"
  types: ["anyjson"]
  methods: ["GET", "POST"]
  roles: ["readonly"]
  jsonparameters:
    - {auto: "fields"}
  docs: |
    RRD (round robin database) record of every packet received by Kismet, including packets which are later dropped.

    This is one of the RRDs included in the [packet statistics](#packet-statistics); see the
    [RRD documentation](/docs/api/rrd/) for the RRD format.
  return: |
    JSON RRD record, in packets per second; the hour and day records are averages.
  responses:
    success:
      - [200, "Success"]

-
  name: "Incoming packet peak rate"
  uri: "/packetchain/packet_peak"
  types: ["anyjson"]
  methods: ["GET", "POST"]
  roles: ["readonly"]
  jsonparameters:
    - {auto: "fields"}
  docs: |
    RRD (round robin database) record of every packet received by Kismet, including packets which are later dropped.

    This is one of the RRDs included in the [packet statistics](#packet-statistics); see the
    [RRD documentation](/docs/api/rrd/) for the RRD format.
  return: |
    JSON RRD record, in packets per second; the hour and day records are the peak per-second rate in each minute and hour, rather than averages.
  responses:
    success:
      - [200, "Success"]

-
  name: "Processed packet rate"
  uri: "/packetchain/packet_processed"
  types: ["anyjson"]
  methods: ["GET", "POST"]
  roles: ["readonly"]
  jsonparameters:
    - {auto: "fields"}
  docs: |
    RRD (round robin database) record of packets which have been fully processed.

    This is one of the RRDs included in the [packet statistics](#packet-statistics); see the
    [RRD documentation](/docs/api/rrd/) for the RRD format.
  return: |
    JSON RRD record, in packets per second; the hour and day records are averages.
  responses:
    success:
      - [200, "Success"]

-
  name: "Error packet rate"
  uri: "/packetchain/packet_error"
  types: ["anyjson"]
  methods: ["GET", "POST"]
  roles: ["readonly"]
  jsonparameters:
    - {auto: "fields"}
  docs: |
    RRD (round robin database) record of processed packets marked as errors, such as corrupt or undecodable frames.  Packets with an invalid checksum are not counted as errors.

    This is one of the RRDs included in the [packet statistics](#packet-statistics); see the
    [RRD documentation](/docs/api/rrd/) for the RRD format.
  return: |
    JSON RRD record, in packets per second; the hour and day records are averages.
  responses:
    success:
      - [200, "Success"]

-
  name: "Duplicate packet rate"
  uri: "/packetchain/packet_dupe"
  types: ["anyjson"]
  methods: ["GET", "POST"]
  roles: ["readonly"]
  jsonparameters:
    - {auto: "fields"}
  docs: |
    RRD (round robin database) record of processed packets identified as duplicates, such as the same packet received by multiple datasources.

    This is one of the RRDs included in the [packet statistics](#packet-statistics); see the
    [RRD documentation](/docs/api/rrd/) for the RRD format.
  return: |
    JSON RRD record, in packets per second; the hour and day records are averages.
  responses:
    success:
      - [200, "Success"]

-
  name: "Dropped packet rate"
  uri: "/packetchain/packet_drop"
  types: ["anyjson"]
  methods: ["GET", "POST"]
  roles: ["readonly"]
  jsonparameters:
    - {auto: "fields"}
  docs: |
    RRD (round robin database) record of packets dropped because the packet processing queue was full.  The queue size is set by `packet_backlog_limit` in `kismet_memory.conf`.

    This is one of the RRDs included in the [packet statistics](#packet-statistics); see the
    [RRD documentation](/docs/api/rrd/) for the RRD format.
  return: |
    JSON RRD record, in packets per second; the hour and day records are averages.
  responses:
    success:
      - [200, "Success"]
